<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060b">
<title>♡</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<div class="grain"></div>
<div class="ambient ambient-one"></div>
<div class="ambient ambient-two"></div>

<main>
  <!-- Первый экран: персонаж + облачко + сердечко-кнопка -->
  <section class="intro screen" id="introScreen">
    <div class="figure">
      <img class="character" src="assets/character.png" alt="Персонаж с плюшевой игрушкой" draggable="false">

      <button class="heart-hotspot" id="heartButton" type="button" aria-label="Открыть послание">
        <span class="pulse"></span><span class="pulse p2"></span>
      </button>

      <div class="bubble">
        <svg viewBox="0 0 250 160" aria-hidden="true">
          <defs>
            <linearGradient id="bubbleFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset="1" stop-color="#ffe6ec"/>
            </linearGradient>
            <path id="bubblePath" d="M34 8C84 2 164 3 214 8c24 3 31 17 30 47 1 30-5 47-30 52-38 5-86 3-118 3-14 11-30 24-58 40 9-15 13-26 14-40-24-3-37-14-38-50C13 27 17 11 34 8Z"/>
          </defs>
          <use href="#bubblePath" transform="translate(5 6)" fill="#e84b70"/>
          <use href="#bubblePath" fill="url(#bubbleFill)" stroke="#241018" stroke-width="3" stroke-linejoin="round"/>
          <path d="M40 20c30-4 70-5 100-4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
        </svg>
        <div class="bubble-text">Нажми на сердечко <b>♥</b></div>
        <span class="spark s1">✦</span>
        <span class="spark s2">♡</span>
      </div>
    </div>
  </section>

  <!-- Вопросы (тексты подставляются из questions.json) -->
  <section class="quiz screen hidden" id="quizScreen" aria-live="polite">
    <div class="dots" id="dots"><i></i><i></i></div>
    <div class="paper-card" id="paperCard">
      <div class="tape"></div>
      <div class="paper-decoration">♡</div>
      <h2 id="questionText"></h2>
      <div class="answers" id="answers"></div>
    </div>
  </section>

  <!-- Финал -->
  <section class="result screen hidden" id="resultScreen" aria-live="polite">
    <div class="final-paper">
      <span class="final-heart">♥</span>
      <p class="wish" id="wishText"></p>
      <div class="divider-heart">♡ ♡ ♡</div>
      <button class="restart" id="restartButton" type="button" aria-label="Начать заново">↻</button>
    </div>
  </section>
</main>

<!-- Переход: открывающийся конверт -->
<div class="env-overlay" id="envOverlay" aria-hidden="true">
  <div class="env-stage">
    <div class="envelope">
      <div class="env-back"></div>
      <div class="env-letter"><span class="letter-heart">♥</span></div>
      <div class="env-front-wrap"><div class="env-front"></div></div>
      <div class="env-flap"><div class="flap-shape"></div></div>
      <div class="env-seal"><span>♥</span></div>
    </div>
  </div>
</div>
</body>
</html>
